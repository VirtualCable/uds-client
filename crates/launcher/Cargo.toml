[package]
name = "launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Enables the TLS certificate-verification bypass in the whole dependency
# graph (shared/connection read `shared::tls::insecure_tls_bypass_allowed`).
# OFF by default: a release launcher built without it forces verification on
# everywhere. Debug builds already allow the bypass for tests/diagnostics.
insecure-tls = ["shared/insecure-tls", "connection/insecure-tls"]

[dependencies]
shared = { path = "../shared" }
js = { path = "../js" }
gui = { path = "../gui" }
rdp.workspace = true
crypt = { path = "../crypt" }
connection = { path = "../connection" }

anyhow = { workspace = true }

tokio = { workspace = true }

open = { workspace = true }

# Persistence
serde = { workspace = true }
serde_json = { workspace = true }

# i18n
gettext = { workspace = true }
rust-embed = { workspace = true }
sys-locale = { workspace = true }

flume = { workspace = true }

[build-dependencies]
builder = { path = "../builder" }
